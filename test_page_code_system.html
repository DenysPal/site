<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Page Code System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Test Page Code System</h1>
    
    <div class="test-section">
        <h2>Current URL Parameters</h2>
        <div id="url-info"></div>
    </div>
    
    <div class="test-section">
        <h2>Session Storage</h2>
        <div id="storage-info"></div>
        <button onclick="clearStorage()">Clear Session Storage</button>
    </div>
    
    <div class="test-section">
        <h2>Test Links</h2>
        <a href="?page=test1" target="_blank">Test Page 1</a><br>
        <a href="?page=test2" target="_blank">Test Page 2</a><br>
        <a href="?page=test3" target="_blank">Test Page 3</a><br>
        <a href="?e=test4" target="_blank">Test Event 4 (old format)</a>
    </div>
    
    <div class="test-section">
        <h2>Console Log</h2>
        <div id="console-log" class="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        // Функція для логування
        function log(message) {
            const logDiv = document.getElementById('console-log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            console.log(message);
        }

        // Функція для очищення логу
        function clearLog() {
            document.getElementById('console-log').innerHTML = '';
        }

        // Функція для очищення session storage
        function clearStorage() {
            sessionStorage.clear();
            updateStorageInfo();
            log('Session storage cleared');
        }

        // Функція для оновлення інформації про URL
        function updateUrlInfo() {
            const urlInfo = document.getElementById('url-info');
            const params = new URLSearchParams(window.location.search);
            let html = '<strong>Current URL:</strong> ' + window.location.href + '<br>';
            html += '<strong>Parameters:</strong><br>';
            for (const [key, value] of params) {
                html += `  ${key}: ${value}<br>`;
            }
            urlInfo.innerHTML = html;
        }

        // Функція для оновлення інформації про session storage
        function updateStorageInfo() {
            const storageInfo = document.getElementById('storage-info');
            let html = '<strong>Session Storage:</strong><br>';
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                html += `  ${key}: ${value}<br>`;
            }
            if (sessionStorage.length === 0) {
                html += '  (empty)<br>';
            }
            storageInfo.innerHTML = html;
        }

        // Функція для отримання page_code з URL
        function getPageCodeFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('page') || params.get('e');
        }

        // Імітація функцій з основного коду
        function testPageCodeSystem() {
            const pageCode = getPageCodeFromUrl();
            log(`Testing page code system...`);
            log(`Page code from URL: ${pageCode}`);
            
            if (!pageCode) {
                log('No page_code found in URL');
                return;
            }

            const currentPageCode = sessionStorage.getItem('page_code');
            log(`Current page_code in storage: ${currentPageCode}`);
            
            if (currentPageCode !== pageCode) {
                log(`Page code changed from ${currentPageCode} to ${pageCode}, clearing session storage`);
                sessionStorage.clear();
                sessionStorage.setItem('page_code', pageCode);
                log('Session storage cleared and updated');
            } else {
                log('Page code unchanged, no action needed');
            }
            
            updateStorageInfo();
        }

        // Ініціалізація при завантаженні сторінки
        window.addEventListener('DOMContentLoaded', function() {
            log('Page loaded');
            updateUrlInfo();
            updateStorageInfo();
            testPageCodeSystem();
        });

        // Оновлення при зміні URL (для SPA)
        window.addEventListener('popstate', function() {
            log('URL changed (popstate)');
            updateUrlInfo();
            updateStorageInfo();
            testPageCodeSystem();
        });

        // Перехоплення кліків по посиланнях
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                log(`Link clicked: ${e.target.href}`);
            }
        });
    </script>
</body>
</html>
